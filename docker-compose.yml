name: intelligent-backoffice-platform

services:
  docs:
    image: squidfunk/mkdocs-material:9
    working_dir: /docs
    command: serve --dev-addr=0.0.0.0:8000
    volumes:
      - .:/docs
    ports:
      - "${DOCS_PORT:-8000}:8000"
    profiles: [docs]

  opa:
    image: openpolicyagent/opa:1.18.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "${OPA_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [runtime, observability, distributed, secure]

  vertical-slice:
    build:
      context: ./samples/vertical-slice
    environment:
      DATABASE_PATH: /data/vertical-slice.db
      POLICY_MODE: opa
      OPA_URL: http://opa:8181
      SERVICE_NAME: intelligent-backoffice-vertical-slice
      ENVIRONMENT: local
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "${OTEL_TRACING_ENABLED:-false}"
      OTLP_ENDPOINT: http://otel-collector:4317
      EVENTING_ENABLED: "false"
      IDENTITY_MODE: headers
    volumes:
      - vertical-slice-data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [runtime, observability]

  secure-api:
    build:
      context: ./samples/vertical-slice
    environment:
      DATABASE_PATH: /data/secure-slice.db
      POLICY_MODE: opa
      OPA_URL: http://opa:8181
      SERVICE_NAME: intelligent-backoffice-secure-api
      ENVIRONMENT: local-secure
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "false"
      EVENTING_ENABLED: "false"
      IDENTITY_MODE: jwt
      IDENTITY_PUBLIC_KEY_PATH: /run/identity/identity-public.pem
      IDENTITY_ISSUER: https://identity.local
      IDENTITY_AUDIENCE: intelligent-backoffice-api
      IDENTITY_ALGORITHM: EdDSA
      IDENTITY_MAX_TTL_SECONDS: "300"
    volumes:
      - secure-slice-data:/data
      - ./.local/security/identity-public.pem:/run/identity/identity-public.pem:ro
    ports:
      - "${SECURE_APP_PORT:-8082}:8080"
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    profiles: [secure]

  distributed-api:
    build:
      context: ./samples/vertical-slice
    environment: &distributed-environment
      DATABASE_PATH: /data/distributed-slice.db
      POLICY_MODE: opa
      OPA_URL: http://opa:8181
      SERVICE_NAME: intelligent-backoffice-distributed-api
      ENVIRONMENT: local-distributed
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "false"
      EVENTING_ENABLED: "true"
      IDENTITY_MODE: headers
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EVENTS_TOPIC: backoffice.events.v1
      DLQ_TOPIC: backoffice.dlq.v1
      CONSUMER_GROUP: backoffice-workflow-v1
      WORKER_MAX_ATTEMPTS: "3"
      WORKER_POLL_SECONDS: "0.25"
    volumes:
      - distributed-slice-data:/data
    ports:
      - "${DISTRIBUTED_APP_PORT:-8081}:8080"
    depends_on:
      opa:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [distributed]

  outbox-publisher:
    build:
      context: ./samples/vertical-slice
    command: ["python", "-m", "app.outbox_worker"]
    environment: *distributed-environment
    volumes:
      - distributed-slice-data:/data
    depends_on:
      distributed-api:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [distributed]

  workflow-worker:
    build:
      context: ./samples/vertical-slice
    command: ["python", "-m", "app.workflow_worker"]
    environment: *distributed-environment
    volumes:
      - distributed-slice-data:/data
    depends_on:
      distributed-api:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [distributed]

  timer-worker:
    build:
      context: ./samples/vertical-slice
    command: ["python", "-m", "app.timer_worker"]
    environment: *distributed-environment
    volumes:
      - distributed-slice-data:/data
    depends_on:
      distributed-api:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [distributed]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    profiles: [distributed]

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create backoffice.events.v1 --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true;
        rpk topic create backoffice.dlq.v1 --partitions 1 --replicas 1 -X brokers=redpanda:9092 || true;
        rpk topic list -X brokers=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: [distributed]

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    profiles: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - jaeger
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      vertical-slice:
        condition: service_healthy
    profiles: [observability]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - jaeger
    profiles: [observability]

networks:
  default:
    name: intelligent-backoffice-platform

volumes:
  vertical-slice-data:
  secure-slice-data:
  distributed-slice-data:
  prometheus-data:
  grafana-data:
