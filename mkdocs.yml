site_name: Intelligent Backoffice Platform Architecture
site_description: Arquitetura de referência para backoffice inteligente com agentes, documentos, workflows, human-in-the-loop e execução governada.
site_url: https://leandrosflora.github.io/intelligent-backoffice-platform-architecture/
repo_url: https://github.com/leandrosflora/intelligent-backoffice-platform-architecture
repo_name: leandrosflora/intelligent-backoffice-platform-architecture
edit_uri: edit/master/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Contexto:
      - Contexto de negócio: context/business-context.md
  - Arquitetura funcional:
      - Visão geral: functional/index.md
      - Mapa de capacidades: functional/capability-map.md
      - Mapa de domínios: functional/domain-map.md
      - Lifecycle do caso: functional/case-lifecycle.md
      - Regras de negócio: functional/business-rules.md
      - Papéis e responsabilidades: functional/roles-and-responsibilities.md
      - Outcome card: functional/outcome-card.md
      - Classificação de risco: functional/risk-classification.md
      - Requisitos não funcionais: functional/non-functional-requirements.md
      - Rastreabilidade: functional/traceability-matrix.md
  - Arquitetura técnica:
      - Visão geral: architecture/index.md
      - C4 Contexto atual: architecture/c4-context-current.md
      - C4 Contexto alvo: architecture/c4-context-target.md
      - C4 Containers atuais: architecture/c4-container-current.md
      - C4 Containers alvo: architecture/c4-container-target.md
      - Componentes do Orchestrator: architecture/component-workflow-orchestrator.md
      - Componentes de Document Intelligence: architecture/component-document-intelligence.md
      - Deployment local: architecture/deployment-local.md
      - Trust boundaries: architecture/trust-boundaries.md
      - Sequências: architecture/sequence-diagrams.md
  - Contratos:
      - Visão geral: contracts/index.md
      - HTTP APIs: contracts/http-apis.md
      - Eventos: contracts/events.md
      - Policies: contracts/policies.md
      - Versionamento: contracts/versioning.md
  - Implementação:
      - Visão geral P4: implementation/index.md
      - Cenários testados: implementation/test-scenarios.md
      - Runbook local: implementation/runbook.md
  - Case aplicado: case-study/index.md
  - Governança: governance/index.md
  - Operações: operations/index.md
  - Segurança: security/index.md
  - Serviços: services/index.md

copyright: Copyright &copy; 2026 Leandro Flora
