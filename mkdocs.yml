site_name: Intelligent Backoffice Platform Architecture
site_description: Arquitetura de referência para backoffice inteligente com agentes, documentos, workflows, human-in-the-loop e execução governada.
site_url: https://leandrosflora.github.io/intelligent-backoffice-platform-architecture/
repo_url: https://github.com/leandrosflora/intelligent-backoffice-platform-architecture
repo_name: leandrosflora/intelligent-backoffice-platform-architecture
edit_uri: edit/master/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Como ler: guide/how-to-read.md
  - Tutorial executável: tutorials/dispute-walkthrough.md
  - Contexto:
      - Contexto de negócio: context/business-context.md
      - Case aplicado: case-study/index.md
      - Roadmap e histórico: roadmap.md
  - Arquitetura funcional:
      - Visão geral: functional/index.md
      - Mapa de capacidades: functional/capability-map.md
      - Mapa de domínios: functional/domain-map.md
      - Lifecycle do caso: functional/case-lifecycle.md
      - Regras de negócio: functional/business-rules.md
      - Papéis e responsabilidades: functional/roles-and-responsibilities.md
      - Outcome card: functional/outcome-card.md
      - Classificação de risco: functional/risk-classification.md
      - Requisitos não funcionais: functional/non-functional-requirements.md
      - Rastreabilidade: functional/traceability-matrix.md
  - Arquitetura técnica:
      - Visão geral: architecture/index.md
      - Estado de implementação: architecture/implementation-status.md
      - C4 Contexto atual: architecture/c4-context-current.md
      - C4 Contexto alvo: architecture/c4-context-target.md
      - C4 Containers atuais: architecture/c4-container-current.md
      - C4 Containers alvo: architecture/c4-container-target.md
      - Componentes do Orchestrator: architecture/component-workflow-orchestrator.md
      - Componentes de Document Intelligence: architecture/component-document-intelligence.md
      - Deployment local alvo: architecture/deployment-local.md
      - Deployment observado: architecture/deployment-observed-baseline.md
      - Deployment distribuído: architecture/deployment-distributed-baseline.md
      - Deployment alvo de produção: architecture/deployment-production-target.md
      - Trust boundaries: architecture/trust-boundaries.md
      - Sequências: architecture/sequence-diagrams.md
  - Decisões arquiteturais:
      - Visão geral: decisions/index.md
      - ADR-001 — Monólito modular: decisions/adr-001-modular-monolith-reference-implementation.md
      - ADR-002 — Target distribuído: decisions/adr-002-logical-distributed-target.md
      - ADR-003 — Autoridade do workflow: decisions/adr-003-workflow-owns-process-state.md
      - ADR-004 — Limites da IA: decisions/adr-004-ai-investigates-and-recommends.md
      - ADR-005 — OPA como PDP: decisions/adr-005-opa-external-policy-decision-point.md
      - ADR-006 — Aprovação humana: decisions/adr-006-human-approval-and-segregation.md
      - ADR-007 — Execução governada: decisions/adr-007-governed-idempotent-execution.md
      - ADR-008 — Outbox e inbox: decisions/adr-008-outbox-inbox-at-least-once.md
      - ADR-009 — Evidência e auditoria: decisions/adr-009-evidence-and-append-only-audit.md
      - ADR-010 — Identidade assinada: decisions/adr-010-signed-local-identity-to-corporate-workload-identity.md
      - ADR-011 — Persistência: decisions/adr-011-local-sqlite-managed-storage-target.md
      - ADR-012 — Observabilidade e evals: decisions/adr-012-observability-and-evals-as-gates.md
      - ADR-013 — Arquitetura como código: decisions/adr-013-architecture-and-contracts-as-code.md
      - Template: decisions/template.md
  - Contratos:
      - Visão geral: contracts/index.md
      - HTTP APIs: contracts/http-apis.md
      - Eventos: contracts/events.md
      - Mensageria: contracts/messaging.md
      - Policies: contracts/policies.md
      - Versionamento: contracts/versioning.md
  - Implementação:
      - Visão geral: implementation/index.md
      - Cenários testados: implementation/test-scenarios.md
      - Runbook local: implementation/runbook.md
  - Avaliação:
      - Visão geral: evaluation/index.md
  - Segurança:
      - Visão geral: security/index.md
      - Identidade de workload: security/workload-identity.md
      - Segredos e KMS: security/secrets-and-kms.md
      - Supply chain: security/supply-chain.md
  - Operações:
      - Visão geral: operations/index.md
      - Observabilidade: operations/observability.md
      - Event backbone: operations/eventing.md
      - Alta disponibilidade e DR: operations/ha-dr.md
      - Capacidade: operations/capacity.md
      - SLOs e alertas: operations/slos.md
      - Runbooks:
          - Erros e latência: operations/runbooks/high-error-rate.md
          - PDP indisponível: operations/runbooks/policy-decision-unavailable.md
          - Execução ambígua: operations/runbooks/execution-ambiguous.md
          - Workflow parado: operations/runbooks/workflow-stuck.md
          - Telemetria indisponível: operations/runbooks/telemetry-pipeline-down.md
          - Regressão de eval: operations/runbooks/eval-regression.md
          - Backlog no outbox: operations/runbooks/outbox-backlog.md
          - DLQ e replay: operations/runbooks/dead-letter-replay.md
          - Timer parado: operations/runbooks/timer-stuck.md
  - Governança:
      - Visão geral: governance/index.md
      - Production readiness: governance/production-readiness.md
  - Catálogo de serviços: services/index.md

