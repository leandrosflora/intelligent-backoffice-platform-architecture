global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vertical-slice
    metrics_path: /metrics
    static_configs:
      - targets: ["vertical-slice:8080"]
        labels:
          environment: local
