groups:
  - name: intelligent-backoffice-recording
    interval: 30s
    rules:
      - record: backoffice:http_error_ratio:5m
        expr: |
          sum(rate(backoffice_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(backoffice_http_requests_total[5m])), 0.000001)
      - record: backoffice:http_success_ratio:5m
        expr: 1 - backoffice:http_error_ratio:5m
      - record: backoffice:http_latency_p95_seconds:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(backoffice_http_request_duration_seconds_bucket[5m]))
          )
      - record: backoffice:policy_availability_ratio:5m
        expr: |
          1 - (
            sum(rate(backoffice_policy_decisions_total{decision="unavailable"}[5m]))
            /
            clamp_min(sum(rate(backoffice_policy_decisions_total[5m])), 0.000001)
          )
