apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-backoffice-api
  namespace: intelligent-backoffice
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligent-backoffice-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intelligent-backoffice-api
        app.kubernetes.io/part-of: intelligent-backoffice-platform
    spec:
      serviceAccountName: intelligent-backoffice-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: intelligent-backoffice-api
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: intelligent-backoffice-api
      containers:
        - name: api
          image: ghcr.io/leandrosflora/intelligent-backoffice-platform@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: intelligent-backoffice-config
            - secretRef:
                name: intelligent-backoffice-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: identity
              mountPath: /run/identity
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: identity
          projected:
            sources:
              - secret:
                  name: intelligent-backoffice-identity-trust
