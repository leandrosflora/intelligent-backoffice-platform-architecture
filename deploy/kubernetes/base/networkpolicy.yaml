apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intelligent-backoffice-api
  namespace: intelligent-backoffice
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intelligent-backoffice-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8181
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
