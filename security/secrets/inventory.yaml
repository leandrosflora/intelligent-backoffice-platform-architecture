version: 0.7.0
status: TARGET_WITH_LOCAL_DRILL
secrets:
  - id: SEC-IDENTITY-SIGNING
    purpose: sign short-lived local identity tokens
    owner: Security Platform
    source: ephemeral-local-file
    productionSource: managed-identity-provider
    rotationDays: 30
    consumers: [secure-e2e-token-minter]
    classification: RESTRICTED
    committedToRepository: false
  - id: SEC-BACKUP-ENVELOPE-KEY
    purpose: encrypt local backup drill artifacts
    owner: Data Platform
    source: ephemeral-local-file
    productionSource: managed-kms
    rotationDays: 30
    consumers: [backup-restore-drill]
    classification: RESTRICTED
    committedToRepository: false
  - id: SEC-DATABASE-CREDENTIAL
    purpose: authenticate to target managed relational database
    owner: Backoffice Platform
    source: not-implemented
    productionSource: external-secret-manager
    rotationDays: 60
    consumers: [api, workers]
    classification: RESTRICTED
    committedToRepository: false
controls:
  - no-secret-values-in-yaml
  - least-privilege-consumers
  - short-lived-credentials-where-supported
  - rotation-owner-and-evidence-required
  - secret-access-must-be-audited
