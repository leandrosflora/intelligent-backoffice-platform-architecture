version: 0.7.0
status: EXECUTABLE_BASELINE
allowMutableTags: false
requiredEvidence:
  - sbom
  - provenance
  - digestPinnedImage
  - pinnedDependencies
  - nonRootRuntime
  - reviewedWorkflow
artifacts:
  sbom:
    format: CycloneDX-1.6
    path: artifacts/sbom.cdx.json
  provenance:
    format: in-toto-SLSA-v1-style
    path: artifacts/provenance.json
  capacity:
    path: artifacts/capacity-report.json
  backupDrill:
    path: artifacts/backup-drill/report.json
admissionTarget:
  requireSignature: true
  requireProvenance: true
  requireSbom: true
  allowedRegistries: [corporate-registry]
  maximumCriticalVulnerabilities: 0
  maximumHighVulnerabilities: 0
  blockUnfixedExceptionsWithoutExpiry: true
dependencyRules:
  requireExactPins: true
  prohibitDirectGitReferences: true
  prohibitEditableInstalls: true
  reviewTransitiveLicenses: true
limitations:
  - baseline provenance is generated in CI but is not cryptographically signed
  - production requires registry attestations and admission verification
