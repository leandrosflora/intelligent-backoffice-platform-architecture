name: P6 Eventing and Distributed Workflow

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: samples/vertical-slice/requirements-dev.txt
      - name: Install dependencies
        working-directory: samples/vertical-slice
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run vertical slice tests
        working-directory: samples/vertical-slice
        env:
          PYTHONPATH: .
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85 -q
      - name: Validate P6 topology and source controls
        run: python scripts/validate_eventing.py
      - name: Validate distributed Compose
        run: docker compose --profile distributed config
      - name: Start distributed baseline
        run: docker compose --profile distributed up -d --build
      - name: Run distributed E2E
        run: python scripts/run_p6_distributed_e2e.py
      - name: Inspect event topics
        run: docker compose exec -T redpanda rpk topic list --brokers=localhost:9092
      - name: Upload P6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-eventing-evidence
          path: p6-e2e-output.jsonl
          if-no-files-found: warn
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile distributed logs --no-color
      - name: Stop distributed baseline
        if: always()
        run: docker compose --profile distributed down -v
