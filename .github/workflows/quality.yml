name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: samples/vertical-slice/src/IntelligentBackoffice.Api/IntelligentBackoffice.Api.csproj

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate contracts and traceability
        run: python scripts/validate_contracts.py

      - name: Validate vertical slice structure
        run: python scripts/validate_vertical_slice.py

      - name: Restore .NET solution
        run: dotnet restore IntelligentBackofficePlatformArchitecture.sln

      - name: Build .NET solution
        run: |
          set -o pipefail
          dotnet build IntelligentBackofficePlatformArchitecture.sln \
            --configuration Release \
            --no-restore \
            2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test authorization policies
        run: bash scripts/test-policies.sh

      - name: Validate diagram sources
        run: python scripts/validate_diagrams.py

      - name: Render PlantUML diagrams
        run: bash scripts/render-diagrams.sh

      - name: Validate generated diagrams
        run: python scripts/validate_diagrams.py --require-generated

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start vertical slice
        run: docker compose --profile vertical-slice up -d --build

      - name: Run vertical slice E2E
        run: bash samples/vertical-slice/tests/e2e.sh

      - name: Collect vertical slice logs
        if: failure()
        run: docker compose --profile vertical-slice logs --no-color api opa postgres

      - name: Stop vertical slice
        if: always()
        run: docker compose --profile vertical-slice down -v
