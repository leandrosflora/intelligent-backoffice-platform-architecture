name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate architecture decision records
        run: python scripts/validate_adrs.py

      - name: Validate contracts and traceability
        run: python scripts/validate_contracts.py

      - name: Test authorization policies
        run: bash scripts/test-policies.sh

      - name: Validate diagram sources
        run: python scripts/validate_diagrams.py

      - name: Render PlantUML diagrams
        run: bash scripts/render-diagrams.sh

      - name: Validate generated diagrams
        run: python scripts/validate_diagrams.py --require-generated

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: rendered-plantuml-diagrams
          path: docs/assets/diagrams
          if-no-files-found: error

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate Docker Compose
        run: docker compose config
