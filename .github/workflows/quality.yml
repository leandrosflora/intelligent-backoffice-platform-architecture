name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate contracts and traceability
        run: python scripts/validate_contracts.py

      - name: Test authorization policies
        run: bash scripts/test-policies.sh

      - name: Validate diagram sources
        run: python scripts/validate_diagrams.py

      - name: Render PlantUML diagrams
        run: bash scripts/render-diagrams.sh

      - name: Validate generated diagrams
        run: python scripts/validate_diagrams.py --require-generated

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: rendered-plantuml-diagrams
          path: docs/assets/diagrams
          if-no-files-found: error

      - name: Commit rendered diagrams to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/diagrams/*.svg docs/assets/diagrams/*.png
          if git diff --cached --quiet; then
            echo "Rendered diagrams are already synchronized."
          else
            git commit -m "docs: add rendered PlantUML assets"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate Docker Compose
        run: docker compose config
