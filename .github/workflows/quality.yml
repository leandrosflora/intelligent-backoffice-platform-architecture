name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate diagram sources
        run: python scripts/validate_diagrams.py

      - name: Render PlantUML diagrams
        run: bash scripts/render-diagrams.sh

      - name: Validate generated diagrams
        run: python scripts/validate_diagrams.py --require-generated

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate Docker Compose
        run: docker compose config
