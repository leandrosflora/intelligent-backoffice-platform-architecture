name: Publish Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Validate repository structure
        run: python scripts/validate_structure.py

      - name: Validate contracts and traceability
        run: python scripts/validate_contracts.py

      - name: Validate vertical slice structure
        run: python scripts/validate_vertical_slice.py

      - name: Test authorization policies
        run: bash scripts/test-policies.sh

      - name: Validate diagram sources
        run: python scripts/validate_diagrams.py

      - name: Render PlantUML diagrams
        run: bash scripts/render-diagrams.sh

      - name: Validate generated diagrams
        run: python scripts/validate_diagrams.py --require-generated

      - name: Build documentation
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
