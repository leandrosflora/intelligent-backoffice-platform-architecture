/v1/cases/{caseId}/investigations:
  post:
    tags:
    - Investigation
    operationId: startInvestigation
    summary: Solicita investigação usando somente tools autorizadas
    x-contract-id: API-INV-001
    x-capabilities:
    - CAP-004
    - PLT-002
    - PLT-005
    - PLT-006
    x-business-rules:
    - BR-006
    - BR-007
    - BR-009
    x-policy-action: investigation.execute
    x-idempotent: true
    parameters:
    - $ref: ../platform-api.yaml#/components/parameters/CaseId
    - $ref: ../platform-api.yaml#/components/parameters/TenantId
    - $ref: ../platform-api.yaml#/components/parameters/CorrelationId
    - $ref: ../platform-api.yaml#/components/parameters/IdempotencyKey
    - $ref: ../platform-api.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../schemas/canonical-models.yaml#/$defs/InvestigationRequest
    responses:
      '202':
        description: Investigação aceita
        content:
          application/json:
            schema:
              $ref: ../../schemas/canonical-models.yaml#/$defs/Investigation
      '400':
        $ref: ../platform-api.yaml#/components/responses/BadRequest
      '401':
        $ref: ../platform-api.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../platform-api.yaml#/components/responses/Forbidden
      '404':
        $ref: ../platform-api.yaml#/components/responses/NotFound
      '409':
        $ref: ../platform-api.yaml#/components/responses/Conflict
      '422':
        $ref: ../platform-api.yaml#/components/responses/UnprocessableEntity
