openapi: 3.1.0
info:
  title: Intelligent Backoffice Platform API
  version: 0.1.0
  description: Contrato inicial das APIs compartilhadas da plataforma.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica a disponibilidade do serviço
      responses:
        "200":
          description: Serviço disponível
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
